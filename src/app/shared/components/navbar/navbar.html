<nav class="navbar">
  <div class="navbar__inner">
    <a routerLink="/" class="navbar__brand" (click)="closeMenu()">
      <img src="/images/code-cube-icon.svg" alt="" aria-hidden="true" class="navbar__brand-icon" />
      <span>Santiago.dev</span>
    </a>

    <button
      class="navbar__toggle"
      type="button"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      aria-label="Abrir menú"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

    <ul class="navbar__links" [class.navbar__links--open]="menuOpen()">
      @for (link of links; track link.path) {
        <li>
          <a
            [routerLink]="link.path"
            routerLinkActive="navbar__link--active"
            [routerLinkActiveOptions]="{ exact: link.path === '/' }"
            (click)="closeMenu()"
          >
            {{ link.label }}
          </a>
        </li>
      }
    </ul>
  </div>
</nav>
