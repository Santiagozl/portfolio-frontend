<section class="login">
  <div class="login__card">
    <p class="login__eyebrow">Admin</p>
    <h1>Entrar al panel</h1>
    <p class="login__intro">Solo tú puedes editar el contenido del sitio desde aquí.</p>

    @if (errorMessage()) {
      <p class="feedback feedback--error">{{ errorMessage() }}</p>
    }

    <form class="admin-form" [formGroup]="form" (ngSubmit)="submit()">
      <label class="admin-form__row">
        <span>Usuario</span>
        <input type="text" formControlName="username" autocomplete="username" />
      </label>

      <label class="admin-form__row">
        <span>Contraseña</span>
        <input type="password" formControlName="password" autocomplete="current-password" />
      </label>

      <div class="admin-form__actions">
        <button type="submit" class="btn" [disabled]="submitting()">
          {{ submitting() ? 'Entrando…' : 'Entrar' }}
        </button>
        <a routerLink="/" class="btn btn--outline">Volver al sitio</a>
      </div>
    </form>
  </div>
</section>
