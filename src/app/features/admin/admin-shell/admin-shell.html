<div class="admin">
  <aside class="admin__sidebar">
    <p class="admin__eyebrow">Panel</p>
    <p class="admin__title">Contenido del sitio</p>

    <nav>
      <ul>
        @for (link of links; track link.path) {
          <li>
            <a
              [routerLink]="link.path"
              routerLinkActive="admin__link--active"
              [routerLinkActiveOptions]="{ exact: link.path === '/admin' }"
            >
              {{ link.label }}
            </a>
          </li>
        }
      </ul>
    </nav>

    <div class="admin__footer">
      <a routerLink="/" class="admin__back">← Ver sitio</a>
      <button type="button" class="btn btn--outline btn--small" (click)="logout()">Salir</button>
    </div>
  </aside>

  <section class="admin__content">
    <router-outlet />
  </section>
</div>
